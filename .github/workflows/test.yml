name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 構文チェック
        run: for f in js/*.js drive-sync.js sw.js; do node --check "$f"; done
      - name: 同期ロジックのテスト
        run: node tools/sync-test/run.js
      - name: Word解析・条文参照・キー登録漏れのテスト
        run: node tools/unit-test/run.js
